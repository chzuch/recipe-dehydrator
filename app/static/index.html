<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频脱水机</title>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="topbar">
  <h1>🍳 视频<span>脱水机</span></h1>
  <input id="url" type="text" placeholder="粘贴 B站视频链接（BV号或完整 URL），如 BV1xx411c7mD" />
  <label style="font-size:13px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:4px">
    <input type="checkbox" id="with-gif"> 生成GIF
  </label>
  <button id="btn-go" class="primary">脱水</button>
</div>
<div class="container">
  <div class="main panel" id="main">
    <div class="empty" id="empty-hint">粘贴一个 B站做饭视频链接，点「脱水」，把视频变成能照着做的菜谱卡。</div>
    <div id="card" hidden></div>
  </div>
  <div class="side">
    <div class="panel">
      <h3>🛒 买菜清单</h3>
      <div id="shopping" class="empty" style="padding:10px">脱水后自动生成</div>
    </div>
    <div class="panel">
      <h3>📚 历史卡片</h3>
      <div id="history"><div class="empty">还没有卡片</div></div>
    </div>
  </div>
</div>
<div id="status" class="status" style="text-align:center"></div>
<script type="module" src="/static/dist/app.js"></script>
</body>
</html>
