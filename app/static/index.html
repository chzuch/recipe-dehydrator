<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的菜谱 · 视频脱水机</title>
<link rel="stylesheet" href="/static/css/app.css">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#e65c41">
<meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/" aria-label="返回我的菜谱库"><span class="brand-mark">🍳</span><span>我的菜谱<em>视频脱水机</em></span></a>
  <div class="import-bar">
    <input id="url" type="text" aria-label="B站视频链接" placeholder="粘贴 B站视频链接或 BV 号" />
    <label class="gif-toggle" title="为每个步骤生成动作演示 GIF">
    <input type="checkbox" id="with-gif"> 生成GIF
  </label>
    <button id="btn-go" class="primary">开始脱水</button>
  </div>
  <button id="btn-theme" class="icon-button" title="切换深浅色" aria-label="切换深浅色">◐</button>
</header>

<div id="library" class="container">
  <div class="main panel">
    <div class="lib-toolbar">
      <div class="library-heading"><span class="eyebrow">RECIPE LIBRARY</span><h2>今天想做点什么？</h2></div>
      <input id="lib-search" type="text" placeholder="🔍 搜菜名或食材…" />
      <select id="lib-category"></select>
      <select id="lib-sort" aria-label="菜谱排序">
        <option value="pinned">置顶优先</option>
        <option value="recent">最近做过</option>
        <option value="newest">最新</option>
      </select>
    </div>
    <div id="lib-grid"></div>
  </div>
</div>

<div id="card-view" hidden>
  <div class="container">
    <div class="main panel">
      <button id="back-to-library" class="back-button">← 菜谱库</button>
      <div class="mode-tabs" aria-label="查看模式">
        <button class="mode-tab active" data-mode="browse">📖 浏览</button>
        <button class="mode-tab" data-mode="cook">🍳 做菜</button>
        <button class="mode-tab" data-mode="shop">🛒 买菜</button>
      </div>
      <div id="browse-view"><div id="card"></div></div>
      <div id="cook-view" hidden>
        <div class="cook-top">
          <div id="cook-ingredients" class="cook-ing-bar"></div>
          <div class="cook-progress-row">
            <span id="cook-counter">步骤 1/1</span>
            <div class="cook-progress-track"><div id="cook-progress" class="cook-progress-fill"></div></div>
          </div>
          <div id="cook-stepbar" class="cook-stepbar"></div>
        </div>
        <div id="cook-step"></div>
        <div class="cook-nav">
          <button id="cook-prev" class="cook-nav-btn">◀ 上一步</button>
          <button id="cook-next" class="cook-nav-btn primary">下一步 ▶</button>
        </div>
      </div>
      <div id="shop-view" hidden></div>
    </div>
    <div class="side">
      <div class="panel">
        <h3>🛒 买菜清单</h3>
        <div id="shopping" class="empty" style="padding:10px">脱水后自动生成</div>
      </div>
    </div>
  </div>
</div>

<div id="status" class="status" aria-live="polite"></div>
<nav class="mobile-nav" aria-label="主导航">
  <a href="#/" class="mobile-nav-item">📖<span>菜谱库</span></a>
  <button class="mobile-nav-item mobile-import" id="btn-mobile-import">＋<span>脱水新视频</span></button>
</nav>
<script type="module" src="/static/dist/app.js"></script>
<script>
  // Service Worker 注册（PWA 离线）
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/static/sw.js").catch(() => {});
  }
</script>
</body>
</html>
